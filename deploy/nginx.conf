# nginx in front of OmniFlow. Set OMNIFLOW_PUBLIC_URL=https://omniflow.example.com and OMNIFLOW_TRUST_PROXY=true.
server {
    listen 443 ssl http2;
    server_name omniflow.example.com;

    ssl_certificate     /etc/letsencrypt/live/omniflow.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omniflow.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;

    # Live run streams: no buffering, long timeout.
    location ~ ^/v1/runs/[^/]+/stream$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name omniflow.example.com;
    return 301 https://$host$request_uri;
}
