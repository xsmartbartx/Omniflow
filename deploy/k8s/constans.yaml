# Constans on Kubernetes — single replica.
#
# Constans keeps its state in one SQLite database on a volume, so it runs as exactly ONE pod with a
# ReadWriteOnce volume and a Recreate rollout (two pods must never open the same database). That is
# plenty for many thousands of runs a day; scale up by giving the pod more CPU/RAM, not more replicas.
#
#   kubectl create namespace constans
#   kubectl -n constans create secret generic constans-secrets \
#     --from-literal=CONSTANS_MASTER_KEY="$(openssl rand -base64 32)" \
#     --from-literal=CONSTANS_ADMIN_PASSWORD='choose-a-long-password' \
#     --from-literal=CONSTANS_METRICS_TOKEN="$(openssl rand -hex 24)"
#   kubectl apply -n constans -f deploy/k8s/constans.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: constans-config
data:
  CONSTANS_ENV: production
  CONSTANS_PUBLIC_URL: https://constans.example.com
  CONSTANS_TRUST_PROXY: "true"
  CONSTANS_ADMIN_EMAIL: admin@example.com
  CONSTANS_LOG_LEVEL: info
  CONSTANS_SEED_EXAMPLES: "false"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: constans-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: constans
  labels: { app.kubernetes.io/name: constans }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/name: constans }
  template:
    metadata:
      labels: { app.kubernetes.io/name: constans }
    spec:
      automountServiceAccountToken: false   # the app never talks to the Kubernetes API
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: constans
          image: ghcr.io/your-org/constans:1.0.0   # build and push your own: docker build -t <registry>/constans:1.0.0 .
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: constans-config }
            - secretRef: { name: constans-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 250m, memory: 384Mi, ephemeral-storage: 128Mi }
            limits: { memory: 1Gi, ephemeral-storage: 1Gi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 4
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 4
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: constans-data }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: constans
spec:
  selector: { app.kubernetes.io/name: constans }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: constans
  annotations:
    # ingress-nginx: keep live run streams (SSE) open and unbuffered
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [constans.example.com]
      secretName: constans-tls
  rules:
    - host: constans.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: constans, port: { name: http } }
---
# Egress control. Workflows can only reach what their capabilities allow, but defence in depth is cheap:
# let the pod talk to DNS and HTTPS(+SMTP) only. Add rules for your databases.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: constans-egress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: constans }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 587 }
        - { protocol: TCP, port: 465 }
---
# Nightly consistent backup. It must run on the same node as the pod (the volume is ReadWriteOnce),
# hence the pod affinity. Copy /data/backups off the volume (e.g. with your cluster's volume snapshots).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: constans-backup
spec:
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels: { app.kubernetes.io/name: constans }
          containers:
            - name: backup
              image: ghcr.io/your-org/constans:1.0.0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  f=/data/backups/constans-$(date -u +%Y%m%dT%H%M%SZ).db
                  constans admin backup "$f"
                  # keep the 14 newest snapshots
                  ls -1dt /data/backups/constans-*.db | tail -n +15 | while read -r old; do rm -rf "$old" "$old.artifacts"; done
              envFrom:
                - configMapRef: { name: constans-config }
                - secretRef: { name: constans-secrets }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: data, mountPath: /data }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: constans-data }
            - name: tmp
              emptyDir: {}
